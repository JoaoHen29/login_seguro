spring.application.name=login_seguro
spring.config.import=optional:file:.env[.properties]

spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:login_seguro}
spring.data.mongodb.auto-index-creation=true

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.thymeleaf.cache=false

app.aparencia.nome-sistema=ThinDesk
app.aparencia.slogan=Chamados t\u00e9cnicos sob controle, da abertura \u00e0 solu\u00e7\u00e3o
app.aparencia.tema=${APP_TEMA:documento}

app.contas-iniciais.criar=true
app.contas-iniciais.senha=${SENHA_INICIAL:}

app.chamados.gerar-exemplos=true
app.chamados.quantidade-exemplos=400