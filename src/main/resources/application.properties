spring.application.name=login_seguro
spring.config.import=optional:file:.env[.properties]

spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:login_seguro}
spring.data.mongodb.auto-index-creation=true

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.thymeleaf.cache=false

app.aparencia.nome-sistema=Login Seguro
app.aparencia.slogan=Sua identidade, conferida a cada acesso.
app.aparencia.tema=${APP_TEMA:documento}

app.contas-iniciais.criar=true
app.contas-iniciais.senha=${SENHA_INICIAL:}
