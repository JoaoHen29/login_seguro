<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comum :: cabeca(~{::title})}">
    <title>Acesso negado | Login Seguro</title>
</head>
<body>
<main class="pagina-erro">
    <div class="guilhoche"></div>
    <div class="pagina-erro__cartao">
        <div class="carimbo" role="img" aria-label="Acesso negado">
            <div><strong>Negado</strong><span>403</span></div>
        </div>
        <h1>Seu perfil não libera esta página</h1>
        <p th:if="${usuarioLogado != null}"
           th:text="|Você entrou como ${usuarioLogado.perfil.nome}. Peça a um administrador se precisar de outro perfil.|">
            Peça a um administrador se precisar de outro perfil.
        </p>
        <a class="botao" th:href="@{/painel}">Voltar para minha credencial</a>
    </div>
</main>
</body>
</html>
