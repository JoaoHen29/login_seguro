<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabeca(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${titulo}">Login Seguro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/temas/{nome}.css(nome=${tema ?: 'documento'})}">
</head>
<body>

<svg th:fragment="selo" class="selo" viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor">
    <circle cx="32" cy="32" r="30" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="25" stroke-width="0.75" stroke-dasharray="1.5 2"/>
    <path d="M32 9 L36 17 L45 15 L44 24 L52 28 L47 35 L52 42 L44 45 L45 53 L36 50 L32 57 L28 50 L19 53 L20 45 L12 42 L17 35 L12 28 L20 24 L19 15 L28 17 Z"
          stroke-width="1"/>
    <circle cx="32" cy="29" r="5" stroke-width="2"/>
    <path d="M29.5 33 L28.5 42 H35.5 L34.5 33" stroke-width="2" stroke-linejoin="round"/>
</svg>

<svg th:fragment="icone-check" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 10.5 L8 14.5 L16 5.5"/>
</svg>

<div th:fragment="mensagens" th:remove="tag">
    <p class="alerta alerta--sucesso" role="status" th:if="${sucesso}" th:text="${sucesso}">Feito.</p>
    <p class="alerta alerta--erro" role="alert" th:if="${erro}" th:text="${erro}">Erro.</p>
</div>

</body>
</html>
